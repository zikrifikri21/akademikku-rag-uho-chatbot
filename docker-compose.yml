name: akademikku-rag-uho

services:
  # Microservice Python FastAPI RAG (v2: bge-m3 + BM25 + reranker)
  rag-api:
    build:
      context: ./uho_rag_api
      dockerfile: Dockerfile
    container_name: uho_rag_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:?isi GROQ_API_KEY di .env}
      - DEFAULT_GROQ_MODEL=${DEFAULT_GROQ_MODEL:-openai/gpt-oss-20b}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?isi INTERNAL_API_KEY di .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 240s

  # Aplikasi Web Utama (Laravel 12 + React 19 Inertia)
  web:
    build:
      context: ./akademikku
      dockerfile: Dockerfile
    container_name: akademikku_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      rag-api:
        condition: service_healthy
    environment:
      - APP_NAME=Akademikku RAG UHO
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:?isi APP_KEY di .env}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - ASSET_URL=${APP_URL:-http://localhost:8000}
      - FORCE_HTTPS=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - RAG_API_URL=http://rag-api:8001
      - RAG_API_KEY=${INTERNAL_API_KEY:?isi INTERNAL_API_KEY di .env}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=sync
    volumes:
      - sqlite_data:/var/www/html/database
      - storage_data:/var/www/html/storage

volumes:
  sqlite_data:
  storage_data:
